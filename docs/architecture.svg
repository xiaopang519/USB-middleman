<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#ffffff"/>

  <!-- 控制机 A -->
  <rect x="40" y="40" width="800" height="160" rx="12" fill="#edf3fb" stroke="#8aa8cc" stroke-width="1.5"/>
  <text x="60" y="70" font-size="16" font-weight="bold" fill="#2c4a6e">控制机 A —— 眼 + 脑</text>

  <rect x="70" y="100" width="130" height="56" rx="8" fill="#ffffff" stroke="#8aa8cc"/>
  <text x="135" y="124" font-size="13" text-anchor="middle" fill="#222">采集卡</text>
  <text x="135" y="143" font-size="11" text-anchor="middle" fill="#666">HDMI → USB</text>

  <line x1="204" y1="128" x2="234" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="240" y="100" width="130" height="56" rx="8" fill="#ffffff" stroke="#8aa8cc"/>
  <text x="305" y="124" font-size="13" text-anchor="middle" fill="#222">ffmpeg</text>
  <text x="305" y="143" font-size="11" text-anchor="middle" fill="#666">产出 latest.png</text>

  <line x1="374" y1="128" x2="404" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="410" y="100" width="130" height="56" rx="8" fill="#ffffff" stroke="#8aa8cc"/>
  <text x="475" y="124" font-size="13" text-anchor="middle" fill="#222">眼（图色识别）</text>
  <text x="475" y="143" font-size="11" text-anchor="middle" fill="#666">读像素 · 帧龄守卫</text>

  <line x1="544" y1="128" x2="574" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="580" y="100" width="170" height="56" rx="8" fill="#dbe7f6" stroke="#5b82b0" stroke-width="1.5"/>
  <text x="665" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c4a6e">决策层（你的代码）</text>
  <text x="665" y="143" font-size="11" text-anchor="middle" fill="#5a6b80">判据只有一份</text>

  <!-- TCP 下行 -->
  <line x1="665" y1="206" x2="665" y2="352" stroke="#555" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="648" y="268" font-size="12.5" font-weight="bold" text-anchor="end" fill="#333">TCP 8300</text>
  <text x="648" y="288" font-size="11" text-anchor="end" fill="#666">一行命令 → 一行回执</text>

  <!-- HDMI 上行（画面回传） -->
  <line x1="135" y1="354" x2="135" y2="208" stroke="#8a94a6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="150" y="268" font-size="11.5" fill="#7a8496">HDMI</text>
  <text x="150" y="286" font-size="11" fill="#7a8496">被控机 B 的画面</text>

  <!-- 被控机 B -->
  <rect x="40" y="360" width="800" height="140" rx="12" fill="#edf8f0" stroke="#7ab88a" stroke-width="1.5"/>
  <text x="60" y="390" font-size="16" font-weight="bold" fill="#2e5e3e">被控机 B —— 手（硬件层）</text>

  <rect x="600" y="410" width="200" height="56" rx="8" fill="#ffffff" stroke="#7ab88a"/>
  <text x="700" y="434" font-size="13" text-anchor="middle" fill="#222">代理 hand_agent</text>
  <text x="700" y="453" font-size="11" text-anchor="middle" fill="#666">板子唯一的主人</text>

  <line x1="596" y1="440" x2="516" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="557" y="428" font-size="11" text-anchor="middle" fill="#666">HID 报文</text>

  <rect x="340" y="410" width="170" height="56" rx="8" fill="#24303a" stroke="#24303a"/>
  <text x="425" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">RP2040</text>
  <text x="425" y="453" font-size="11" text-anchor="middle" fill="#b8c4d0">USB 中介人</text>

  <line x1="336" y1="440" x2="256" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="296" y="428" font-size="11" text-anchor="middle" fill="#666">USB（数据线）</text>

  <rect x="70" y="410" width="180" height="56" rx="8" fill="#dbeee2" stroke="#4e9668" stroke-width="1.5"/>
  <text x="160" y="434" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e5e3e">被控机输入栈</text>
  <text x="160" y="453" font-size="11" text-anchor="middle" fill="#5a7a66">收到真·键鼠事件</text>
</svg>
